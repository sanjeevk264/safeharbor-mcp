[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeharbor-mcp"
version = "0.1.0"
description = "A guarded MCP gateway that lets AI agents analyze healthcare claims without touching PHI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
safeharbor-server = "safeharbor.server:main"
safeharbor-redteam = "safeharbor.redteam:main"

[tool.setuptools]
packages = ["safeharbor"]
